$terminal = kitty
$fileManager = index
$menu = exec rofi -show drun
$browser = exec firefox


#       _         _          ____  _             _   
#      / \  _   _| |_ ___   / ___|| |_ __ _ _ __| |_ 
#     / _ \| | | | __/ _ \  \___ \| __/ _` | '__| __|
